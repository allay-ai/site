<!doctype html>
<!-- The link preview card, 1200×630. `pnpm og` screenshots it into
     public/og-image.png; edit this file, never the PNG. Fonts come from
     node_modules and src/assets/fonts, the game's textures from public/mc/,
     so run `pnpm install` first. It follows the site: the mark's night navy,
     the game's font, and Allay answering in the game's own window. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Onest';
        src: url('../node_modules/@fontsource-variable/onest/files/onest-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Minecraft';
        src: url('../src/assets/fonts/minecraft.woff2') format('woff2');
        font-weight: 400;
      }
      :root {
        --paper: oklch(17% 0.035 268);
        --ink: oklch(95% 0.012 250);
        --ink-2: oklch(86% 0.02 250);
        --aqua: oklch(84% 0.13 205);
        --lore: oklch(76% 0.004 250);
        --green: oklch(85% 0.2 145);
        --shadow: oklch(32% 0.004 250);
        --chat: oklch(46% 0.004 260 / 0.5);
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: 'Onest', sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      .mark {
        position: absolute;
        left: 72px;
        top: 64px;
        width: 96px;
        height: 96px;
        border-radius: 20px;
      }
      .wordmark {
        position: absolute;
        left: 188px;
        top: 96px;
        font-family: 'Minecraft', monospace;
        font-size: 32px;
      }
      /* The game's letters at multiples of 4 px, so their pixels stay whole. */
      h1 {
        position: absolute;
        left: 72px;
        top: 216px;
        margin: 0;
        font-family: 'Minecraft', monospace;
        font-weight: 400;
        font-size: 48px;
        line-height: 1.15;
      }
      p {
        position: absolute;
        left: 72px;
        top: 360px;
        width: 520px;
        margin: 0;
        font-size: 28px;
        line-height: 1.4;
        color: var(--ink-2);
      }
      code {
        font-family: 'Minecraft', monospace;
        font-size: 24px;
        color: var(--aqua);
      }
      .domain {
        position: absolute;
        left: 72px;
        bottom: 56px;
        font-family: 'Minecraft', monospace;
        font-size: 24px;
        color: var(--aqua);
      }
      /* popup/background.png, border 6 at 2×: the game's window. */
      .window {
        position: absolute;
        right: 56px;
        top: 214px;
        width: 448px;
        display: grid;
        gap: 16px;
        padding: 8px;
        border: 12px solid transparent;
        border-image: url('../public/mc/window.png') 6 fill / 12px repeat;
        image-rendering: pixelated;
        font-family: 'Minecraft', monospace;
        font-size: 20px;
        line-height: 1.5;
        color: var(--ink);
        text-shadow: 2px 2px 0 var(--shadow);
      }
      .chat {
        padding: 4px 8px;
        background: var(--chat);
      }
      .aqua { color: var(--aqua); }
      .lore { color: var(--lore); }
      .green { color: var(--green); }
      /* widget/text_field.png, border 1 at 2×: the chat's input line. */
      .input {
        padding: 4px 8px;
        border: 2px solid transparent;
        border-image: url('../public/mc/text_field.png') 1 fill / 2px stretch;
      }
    </style>
  </head>
  <body>
    <img class="mark" src="../public/icon-512.png" alt="" />
    <div class="wordmark">Allay AI</div>
    <h1>Ask your world<br />anything</h1>
    <p>Type <code>/ask</code>, and Allay reads your real Minecraft game before it answers.</p>
    <div class="domain">allay.chat</div>
    <div class="window">
      <div class="chat">
        <span class="aqua">✦ Allay</span><span class="lore"> » </span>2 stacks sit in the chest left of your furnace, and 14 more in the barrel under the stairs. I lit them up.
        <span class="green">[The way]</span>
      </div>
      <div class="input"><span class="aqua">/ask</span> where did I put my redstone?</div>
    </div>
  </body>
</html>
