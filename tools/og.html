<!doctype html>
<!-- The link preview card, 1200×630. `pnpm og` screenshots it into
     public/og-image.png; edit this file, never the PNG. Fonts come from
     node_modules, so run `pnpm install` first. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Onest';
        src: url('../node_modules/@fontsource-variable/onest/files/onest-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Pixelify';
        src: url('../node_modules/@fontsource-variable/pixelify-sans/files/pixelify-sans-latin-wght-normal.woff2') format('woff2');
        font-weight: 400 700;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: 'Onest', sans-serif;
        color: #e7eff9;
        background:
          radial-gradient(ellipse 600px 420px at 12% 8%, rgba(64, 160, 255, 0.35), transparent 70%),
          radial-gradient(ellipse 520px 420px at 95% 95%, rgba(130, 100, 255, 0.35), transparent 70%),
          #070d18;
      }
      .mark {
        position: absolute;
        left: 80px;
        top: 70px;
        width: 108px;
        height: 108px;
      }
      h1 {
        position: absolute;
        left: 80px;
        top: 210px;
        margin: 0;
        font-size: 78px;
        line-height: 1;
        letter-spacing: -2.5px;
        font-weight: 750;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(100deg, #5bbcff, #a993ff);
        -webkit-background-clip: text;
        color: transparent;
      }
      p {
        position: absolute;
        left: 80px;
        top: 420px;
        width: 560px;
        margin: 0;
        font-size: 30px;
        line-height: 1.35;
        color: #a5b5ca;
      }
      .domain {
        position: absolute;
        left: 80px;
        bottom: 56px;
        font-size: 26px;
        font-weight: 600;
        color: #7cc9ff;
      }
      .chat {
        position: absolute;
        right: 70px;
        top: 160px;
        width: 400px;
        padding: 20px 22px;
        background: rgba(0, 0, 0, 0.55);
        border: 2px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        font-family: 'Pixelify', monospace;
        font-size: 24px;
        line-height: 1.45;
        color: #fff;
      }
      .gray { color: #aaa; }
      .dark { color: #9a9a9a; }
      .aqua { color: #55ffff; }
      .aqua-dark { color: #00aaaa; }
      .green { color: #55ff55; text-decoration: underline; }
      .cmd { margin-top: 14px; padding: 6px 10px; background: rgba(0, 0, 0, 0.5); }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe1ff" /><stop offset="1" stop-color="#2a86f0" /></linearGradient>
        <linearGradient id="w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f8ff" /><stop offset="1" stop-color="#8fd0ff" /></linearGradient>
      </defs>
      <path d="M29 31C18 14 3 17 5 29c2 10 16 10 24 6Z" fill="url(#w)" opacity=".92" />
      <path d="M35 31c11-17 26-14 24-2-2 10-16 10-24 6Z" fill="url(#w)" opacity=".92" />
      <path d="M24 37h16l-3 15a3 3 0 0 1-3 2.4h-4A3 3 0 0 1 27 52Z" fill="url(#b)" />
      <rect x="19" y="14" width="26" height="24" rx="9" fill="url(#b)" />
      <rect x="25" y="23" width="4.5" height="7" rx="2" fill="#0b2a4a" />
      <rect x="34.5" y="23" width="4.5" height="7" rx="2" fill="#0b2a4a" />
      <path d="m53 3 2 5.2 5.2 2-5.2 2L53 17.4l-2-5.2-5.2-2 5.2-2Z" fill="#ffd25e" />
    </svg>
    <h1>Ask your world<br /><em>anything</em></h1>
    <p>An AI helper in your Minecraft server’s chat that looks into the player’s real game.</p>
    <div class="domain">allay.chat</div>
    <div class="chat">
      <div class="gray">⏺ Searching for redstone</div>
      <div class="dark">&nbsp;&nbsp;⎿ 3 chests within 32 blocks</div>
      <div><span class="aqua-dark">✦ </span><span class="aqua">Allay</span> <span class="dark">»</span> 2 stacks sit in the chest left of your furnace. I lit it up for you.</div>
      <div><span class="green">[The way]</span></div>
      <div class="cmd">/ask where did I put my redstone?</div>
    </div>
  </body>
</html>
