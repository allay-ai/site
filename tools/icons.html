<!doctype html>
<!-- The PNG icons for browsers and phones that skip SVG: the mark from
     public/favicon.svg on a dark tile. `pnpm icons` screenshots this page at
     64 px and 180 px. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; overflow: hidden; background: #0b1424; }
      img { display: block; width: 80vw; height: 80vh; margin: 10vh 10vw; }
    </style>
  </head>
  <body>
    <img src="../public/favicon.svg" alt="" />
  </body>
</html>
