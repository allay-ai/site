<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070d18" media="(prefers-color-scheme: dark)" />
    <!-- Runs before the first paint, so a visitor who picked a theme never sees
         the other one flash. A file rather than inline code, because the CSP in
         public/_headers allows scripts from this origin only. -->
    <script src="/theme.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Allay" />
    <!-- Absolute, because a crawler resolves it against its own host, and PNG,
         because several crawlers skip WebP. Regenerate with `pnpm og`. -->
    <meta property="og:image" content="https://allay.chat/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Allay: an AI helper in your Minecraft server's chat" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://allay.chat/og-image.png" />
    <!--route-head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
